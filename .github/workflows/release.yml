name: Build & Release

# Trigger: pushing a version tag (e.g. `git tag v1.1.0 && git push origin v1.1.0`)
# builds the universal macOS app and the Windows installers (NSIS + MSI),
# attaching them to a GitHub Release using Tauri.
on:
  push:
    tags:
      - 'v*'
  # Manual runs from the Actions tab build + verify only (no tag = no release).
  # Dispatch from a tag ref (e.g. v1.1.0) if you want a manual run to publish.
  workflow_dispatch: {}

permissions:
  contents: write # required to create releases and upload assets

jobs:
  release:
    runs-on: macos-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Universal builds compile for both Apple architectures, so install the
      # two arch targets (not a 'universal' target — that's a Tauri bundler
      # concept, not a rustup one).
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm ci

      - name: Verify tag matches app version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          APP_VERSION="v$(node -p 'require("./src-tauri/tauri.conf.json").version')"
          if [ "$TAG" != "$APP_VERSION" ]; then
            echo "::error::Tag '$TAG' does not match src-tauri/tauri.conf.json version '$APP_VERSION'. Bump it first."
            exit 1
          fi
          echo "Building release for $TAG"

      # Load signing/notarization credentials ONLY when the repo secrets are
      # actually set. An unset secret renders as an empty string, and Tauri
      # treats a non-empty APPLE_CERTIFICATE as a real base64 .p12 to import —
      # exporting nothing keeps the build unsigned. Secrets are written with
      # the NAME<<EOF delimiter form so special characters cannot corrupt the
      # env file. Env var names are Tauri's (different from electron-builder).
      - name: Load signing credentials (if configured)
        shell: bash
        run: |
          if [ -z "${{ secrets.APPLE_CERTIFICATE }}" ]; then
            echo "::notice::No signing credentials configured — building unsigned."
            exit 0
          fi
          if [ -z "${{ secrets.APPLE_CERTIFICATE_PASSWORD }}" ] || [ -z "${{ secrets.APPLE_ID }}" ] \
            || [ -z "${{ secrets.APPLE_PASSWORD }}" ] || [ -z "${{ secrets.APPLE_TEAM_ID }}" ]; then
            echo "::error::APPLE_CERTIFICATE is set but APPLE_CERTIFICATE_PASSWORD, APPLE_ID, APPLE_PASSWORD and APPLE_TEAM_ID must ALL be set for a signed + notarized release."
            exit 1
          fi
          echo "APPLE_CERTIFICATE<<EOF" >> "$GITHUB_ENV"
          echo "${{ secrets.APPLE_CERTIFICATE }}" >> "$GITHUB_ENV"
          echo "EOF" >> "$GITHUB_ENV"
          echo "APPLE_CERTIFICATE_PASSWORD<<EOF" >> "$GITHUB_ENV"
          echo "${{ secrets.APPLE_CERTIFICATE_PASSWORD }}" >> "$GITHUB_ENV"
          echo "EOF" >> "$GITHUB_ENV"
          echo "APPLE_ID<<EOF" >> "$GITHUB_ENV"
          echo "${{ secrets.APPLE_ID }}" >> "$GITHUB_ENV"
          echo "EOF" >> "$GITHUB_ENV"
          echo "APPLE_PASSWORD<<EOF" >> "$GITHUB_ENV"
          echo "${{ secrets.APPLE_PASSWORD }}" >> "$GITHUB_ENV"
          echo "EOF" >> "$GITHUB_ENV"
          echo "APPLE_TEAM_ID<<EOF" >> "$GITHUB_ENV"
          echo "${{ secrets.APPLE_TEAM_ID }}" >> "$GITHUB_ENV"
          echo "EOF" >> "$GITHUB_ENV"
          echo "::notice::Signing credentials loaded — release will be signed + notarized."

      # Tauri's DMG bundling requires the create-dmg CLI (not preinstalled
      # on GitHub macOS runners).
      - name: Install DMG tooling
        run: brew install create-dmg

      # beforeBuildCommand (npm run build) runs automatically; --target
      # produces a single universal .app + .dmg for both chips.
      - name: Build universal macOS app (Tauri)
        run: npx tauri build --target universal-apple-darwin

      - name: List artifacts
        run: |
          echo '--- dmg ---'
          ls -lh src-tauri/target/universal-apple-darwin/release/bundle/dmg/
          echo '--- macos ---'
          ls -lh src-tauri/target/universal-apple-darwin/release/bundle/macos/

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # DMG is the primary installer; the .app archive is emitted by some
          # Tauri versions as .app.tar.gz (or as a bare .app dir) — match both.
          files: |
            src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
            src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz
          generate_release_notes: true

  # Windows build — Tauri cannot cross-compile from macOS, so the Windows
  # installers (NSIS + MSI) are built on a Windows runner and attached to the
  # same release. The MSI target downloads the WiX toolset on first use.
  release-windows:
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm ci

      - name: Verify tag matches app version
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $TAG = $env:GITHUB_REF -replace '^refs/tags/', ''
          $APP_VERSION = 'v' + (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          if ($TAG -ne $APP_VERSION) {
            Write-Error "Tag '$TAG' does not match src-tauri/tauri.conf.json version '$APP_VERSION'. Bump it first."
            exit 1
          }
          Write-Host "Building release for $TAG"

      # beforeBuildCommand (npm run build) runs automatically; the target list
      # is explicit here so CI keeps producing both installers even if the
      # config changes (default targets come from tauri.windows.conf.json).
      - name: Build Windows app (Tauri)
        run: npx tauri build --bundles nsis,msi

      # bash is used explicitly: Windows runners default to PowerShell, where
      # `ls -lh` (Git Bash syntax) is not a valid Get-ChildItem parameter.
      - name: List artifacts
        shell: bash
        run: |
          echo '--- nsis ---'
          ls -lh src-tauri/target/release/bundle/nsis/
          echo '--- msi ---'
          ls -lh src-tauri/target/release/bundle/msi/

      # Optional Windows code-signing. When the WINDOWS_CERT_BASE64 and
      # WINDOWS_CERT_PASSWORD secrets are set (base64-encoded .pfx + its
      # password), the NSIS and MSI installers are signed with signtool from
      # the preinstalled Windows SDK (RFC 3161 timestamped). Without the
      # secrets the build proceeds unsigned and SmartScreen will warn.
      - name: Sign Windows installers (if configured)
        if: ${{ secrets.WINDOWS_CERT_BASE64 != '' }}
        shell: pwsh
        env:
          WINDOWS_CERT_BASE64: ${{ secrets.WINDOWS_CERT_BASE64 }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
          WINDOWS_TIMESTAMP_URL: ${{ secrets.WINDOWS_TIMESTAMP_URL }}
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not $env:WINDOWS_CERT_PASSWORD) {
            Write-Error 'WINDOWS_CERT_BASE64 is set but WINDOWS_CERT_PASSWORD is missing.'
          }
          # signtool ships with the Windows SDK, which is preinstalled on the
          # runner; pick the newest SDK version if several are present.
          $signtool = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe' |
            Sort-Object { [version] (($_.FullName -split '\\bin\\')[1] -split '\\')[0] } -Descending |
            Select-Object -First 1 -ExpandProperty FullName
          if (-not $signtool) {
            Write-Error 'signtool.exe not found — is the Windows SDK installed on the runner?'
          }
          $cert = Join-Path $env:RUNNER_TEMP 'windows-signing.pfx'
          [IO.File]::WriteAllBytes($cert, [Convert]::FromBase64String($env:WINDOWS_CERT_BASE64))
          $timestamp = if ($env:WINDOWS_TIMESTAMP_URL) { $env:WINDOWS_TIMESTAMP_URL } else { 'https://timestamp.digicert.com' }
          $signed = 0
          try {
            foreach ($glob in @('src-tauri/target/release/bundle/nsis/*.exe', 'src-tauri/target/release/bundle/msi/*.msi')) {
              Get-ChildItem $glob | ForEach-Object {
                $signed++
                Write-Host "Signing $($_.FullName)"
                & $signtool sign /f $cert /p $env:WINDOWS_CERT_PASSWORD /fd SHA256 /tr $timestamp /td SHA256 /v $_.FullName
                if ($LASTEXITCODE -ne 0) { throw "signtool sign failed for $($_.FullName)" }
                & $signtool verify /pa /v $_.FullName | Out-Host
                if ($LASTEXITCODE -ne 0) { throw "signtool verify failed for $($_.FullName)" }
              }
            }
            if ($signed -eq 0) {
              throw 'No NSIS/MSI installer files found to sign — check the build outputs.'
            }
          } finally {
            Remove-Item $cert -Force -ErrorAction SilentlyContinue
          }

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # NSIS installer (per-user friendly) and MSI (enterprise/GPO friendly)
          # are both built (and signed when configured) by the steps above.
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
