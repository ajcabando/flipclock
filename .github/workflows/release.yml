name: Build & Release

# Trigger: pushing a version tag (e.g. `git tag v1.1.0 && git push origin v1.1.0`)
# builds the universal macOS app and attaches the DMG + zip to a GitHub Release.
on:
  push:
    tags:
      - 'v*'
  # Manual runs from the Actions tab build + verify only (no tag = no release).
  # Dispatch from a tag ref (e.g. v1.1.0) if you want a manual run to publish.
  workflow_dispatch: {}

permissions:
  contents: write # required to create releases and upload assets

env:
  # Never auto-discover certs on CI runners.
  CSC_IDENTITY_AUTO_DISCOVERY: 'false'

jobs:
  release:
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          PKG_VERSION="v$(npm pkg get version | tr -d '\"')"
          if [ "$TAG" != "$PKG_VERSION" ]; then
            echo "::error::Tag '$TAG' does not match package.json version '$PKG_VERSION'. Bump package.json first."
            exit 1
          fi
          echo "Building release for $TAG"

      # Load signing/notarization credentials ONLY when the repo secrets are
      # actually set. An unset secret renders as an empty string, and an empty
      # CSC_LINK makes electron-builder treat it as a cert file path and fail
      # the build ('not a file'). Exporting nothing keeps the build unsigned.
      # Secrets are written with the NAME<<EOF delimiter form so special
      # characters in the .p12 password cannot corrupt the env file.
      - name: Load signing credentials (if configured)
        shell: bash
        run: |
          if [ -z "${{ secrets.CSC_LINK }}" ]; then
            echo "::notice::No signing credentials configured — building unsigned."
            exit 0
          fi
          if [ -z "${{ secrets.CSC_KEY_PASSWORD }}" ] || [ -z "${{ secrets.APPLE_ID }}" ] \
            || [ -z "${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}" ] || [ -z "${{ secrets.APPLE_TEAM_ID }}" ]; then
            echo "::error::CSC_LINK is set but CSC_KEY_PASSWORD, APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD and APPLE_TEAM_ID must ALL be set for a signed + notarized release."
            exit 1
          fi
          echo "CSC_LINK<<EOF" >> "$GITHUB_ENV"
          echo "${{ secrets.CSC_LINK }}" >> "$GITHUB_ENV"
          echo "EOF" >> "$GITHUB_ENV"
          echo "CSC_KEY_PASSWORD<<EOF" >> "$GITHUB_ENV"
          echo "${{ secrets.CSC_KEY_PASSWORD }}" >> "$GITHUB_ENV"
          echo "EOF" >> "$GITHUB_ENV"
          echo "APPLE_ID<<EOF" >> "$GITHUB_ENV"
          echo "${{ secrets.APPLE_ID }}" >> "$GITHUB_ENV"
          echo "EOF" >> "$GITHUB_ENV"
          echo "APPLE_APP_SPECIFIC_PASSWORD<<EOF" >> "$GITHUB_ENV"
          echo "${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}" >> "$GITHUB_ENV"
          echo "EOF" >> "$GITHUB_ENV"
          echo "APPLE_TEAM_ID<<EOF" >> "$GITHUB_ENV"
          echo "${{ secrets.APPLE_TEAM_ID }}" >> "$GITHUB_ENV"
          echo "EOF" >> "$GITHUB_ENV"
          echo "::notice::Signing credentials loaded — release will be signed + notarized."

      # --publish never: electron-builder sees the git tag and would otherwise
      # attempt its own implicit publish to GitHub.
      - name: Build universal macOS app
        run: npm run build && npx electron-builder --mac --universal --publish never

      - name: List artifacts
        run: ls -lh release/

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          files: |
            release/*.dmg
            release/*.zip
          generate_release_notes: true
          fail_on_unmatched_files: true
