<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <!-- App background -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#23232c"/>
      <stop offset="0.55" stop-color="#14141a"/>
      <stop offset="1" stop-color="#0a0a0e"/>
    </linearGradient>
    <radialGradient id="bgGlow" cx="0.5" cy="0.32" r="0.85">
      <stop offset="0" stop-color="#3b82f6" stop-opacity="0.34"/>
      <stop offset="0.55" stop-color="#3b82f6" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
    <!-- Flip card body -->
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2e2e38"/>
      <stop offset="0.5" stop-color="#23232b"/>
      <stop offset="1" stop-color="#1b1b22"/>
    </linearGradient>
    <linearGradient id="cardTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a3a46"/>
      <stop offset="1" stop-color="#2c2c36"/>
    </linearGradient>
    <!-- Digits -->
    <linearGradient id="digit" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.52" stop-color="#f2f2f7"/>
      <stop offset="1" stop-color="#c9c9d4"/>
    </linearGradient>
    <!-- Colon glow -->
    <radialGradient id="dotGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#60a5fa" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#60a5fa" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="cardLeftClip">
      <rect x="152" y="330" width="298" height="360" rx="46"/>
    </clipPath>
    <clipPath id="cardRightClip">
      <rect x="574" y="330" width="298" height="360" rx="46"/>
    </clipPath>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="26" stdDeviation="26" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Rounded app tile -->
  <rect x="0" y="0" width="1024" height="1024" rx="224" fill="url(#bg)"/>
  <rect x="0" y="0" width="1024" height="1024" rx="224" fill="url(#bgGlow)"/>

  <!-- Top edge highlight -->
  <rect x="0" y="0" width="1024" height="300" rx="224" fill="url(#bgGlow)" opacity="0">
    <animate attributeName="opacity" values="0;0" dur="1s"/>
  </rect>

  <!-- Left card -->
  <g filter="url(#softShadow)">
    <rect x="152" y="330" width="298" height="360" rx="46" fill="url(#card)" stroke="rgba(255,255,255,0.09)" stroke-width="4"/>
    <g clip-path="url(#cardLeftClip)">
      <rect x="152" y="330" width="298" height="180" fill="url(#cardTop)"/>
      <rect x="152" y="330" width="298" height="3" fill="rgba(255,255,255,0.28)" opacity="0.5"/>
    </g>
    <!-- seam -->
    <rect x="168" y="506" width="266" height="3" fill="rgba(0,0,0,0.45)"/>
    <rect x="168" y="508" width="266" height="2" fill="rgba(255,255,255,0.12)"/>
    <!-- digit -->
    <text x="301" y="592" font-family="'SF Pro Display', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="232" font-weight="800" fill="url(#digit)" text-anchor="middle" dominant-baseline="middle">8</text>
  </g>

  <!-- Right card -->
  <g filter="url(#softShadow)">
    <rect x="574" y="330" width="298" height="360" rx="46" fill="url(#card)" stroke="rgba(255,255,255,0.09)" stroke-width="4"/>
    <g clip-path="url(#cardRightClip)">
      <rect x="574" y="330" width="298" height="180" fill="url(#cardTop)"/>
      <rect x="574" y="330" width="298" height="3" fill="rgba(255,255,255,0.28)" opacity="0.5"/>
    </g>
    <rect x="590" y="506" width="266" height="3" fill="rgba(0,0,0,0.45)"/>
    <rect x="590" y="508" width="266" height="2" fill="rgba(255,255,255,0.12)"/>
    <text x="723" y="592" font-family="'SF Pro Display', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="232" font-weight="800" fill="url(#digit)" text-anchor="middle" dominant-baseline="middle">8</text>
  </g>

  <!-- Colon with glow -->
  <circle cx="505" cy="452" r="46" fill="url(#dotGlow)"/>
  <circle cx="505" cy="452" r="17" fill="#ffffff"/>
  <circle cx="505" cy="568" r="46" fill="url(#dotGlow)"/>
  <circle cx="505" cy="568" r="17" fill="#ffffff"/>
</svg>
