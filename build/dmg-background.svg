<svg xmlns="http://www.w3.org/2000/svg" width="660" height="400" viewBox="0 0 660 400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b1b24"/>
      <stop offset="0.55" stop-color="#12121a"/>
      <stop offset="1" stop-color="#0a0a0f"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.28" r="0.7">
      <stop offset="0" stop-color="#3b82f6" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="textGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#b9b9c8"/>
    </linearGradient>
  </defs>

  <rect width="660" height="400" fill="url(#bg)"/>
  <rect width="660" height="400" fill="url(#glow)"/>

  <!-- Title -->
  <text x="330" y="86" font-family="'SF Pro Display', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="34" font-weight="800" fill="url(#textGrad)" text-anchor="middle" letter-spacing="-0.5">Flip Clock</text>
  <text x="330" y="112" font-family="'SF Pro Text', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#8a8a99" text-anchor="middle">Drag to your Applications folder</text>

  <!-- App drop zone (left) -->
  <rect x="120" y="150" width="140" height="140" rx="28" fill="none" stroke="rgba(255,255,255,0.14)" stroke-width="2" stroke-dasharray="7 7"/>
  <text x="190" y="318" font-family="'SF Pro Text', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="600" fill="#c9c9d6" text-anchor="middle">Flip Clock.app</text>

  <!-- Arrow -->
  <g stroke="#5b5b6d" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <line x1="300" y1="220" x2="356" y2="220"/>
    <path d="M346 210 L358 220 L346 230"/>
  </g>

  <!-- Applications drop zone (right) -->
  <rect x="400" y="150" width="140" height="140" rx="28" fill="none" stroke="rgba(255,255,255,0.14)" stroke-width="2" stroke-dasharray="7 7"/>
  <text x="470" y="318" font-family="'SF Pro Text', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="600" fill="#c9c9d6" text-anchor="middle">Applications</text>

  <!-- Version -->
  <text x="330" y="372" font-family="'SF Pro Text', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#5d5d6d" text-anchor="middle">version 1.0.0</text>
</svg>
